services:
  bugbot:
    build: .
    container_name: bugbot
    env_file: .env
    volumes:
      - /opt/servers/stacks/bugbot/work:/workspace
      - /opt/servers/stacks/bugbot/opencode:/root/.config/opencode
      - /opt/servers/stacks/bugbot/opencode-data:/root/.local/share/opencode
      - /opt/servers/stacks/bugbot/logs:/var/log
    restart: unless-stopped

volumes: {}
